<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ask your CA</title>
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1f5f8b" />
<link rel="icon" type="image/png" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ask CA" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="side-top">
      <div class="brand"><span class="brand-mark">CA</span> Ask your CA</div>
      <div class="whoami"><span>Logged in as <strong id="me"></strong></span><button id="logout" class="btn-text">Log out</button></div>
      <div class="seg" role="tablist">
        <button type="button" data-section="discussions" class="active">Discussions</button>
        <button type="button" data-section="clients">Clients</button>
      </div>
      <div id="side-discussions" class="side-tools">
        <button id="new-conv" class="btn-primary">+ New question</button>
        <input id="search" type="search" placeholder="Search all past discussions…" />
      </div>
      <div id="side-clients" class="side-tools" style="display:none">
        <button id="new-client" class="btn-primary">+ Add client</button>
        <input id="client-filter" type="search" placeholder="Find client by name, PAN, GSTIN, person…" />
        <label class="check-line"><input type="checkbox" id="only-mine" /> Only clients I handle</label>
      </div>
      <button id="install" class="btn-plain install-btn" style="display:none">📲 Install app on this device</button>
      <div id="install-hint" class="install-hint" style="display:none">To install on iPhone: tap <strong>Share</strong> <span aria-hidden="true">⬆︎</span> then <strong>Add to Home Screen</strong>.</div>
    </div>
    <div id="side-list" class="conv-list"></div>
  </aside>

  <main class="main">
    <header class="conv-head">
      <div class="head-left">
        <button id="menu" class="btn-plain menu-btn" aria-label="Show menu">☰</button>
        <div style="min-width:0">
          <h1 id="head-title">New question</h1>
          <div id="head-meta" class="conv-meta"></div>
        </div>
      </div>
      <div id="head-actions" class="head-actions"></div>
    </header>

    <!-- Discussion view -->
    <div id="view-chat" class="view">
      <div id="thread" class="thread"></div>
      <div class="composer">
        <div class="composer-top">
          <div class="mode" id="mode">
            <button type="button" data-mode="ask" class="active">Ask the CA</button>
            <button type="button" data-mode="note" class="note-mode" id="note-mode-btn" disabled title="Open a discussion to add a team note">Add team note</button>
          </div>
          <label class="client-pick">Client
            <select id="client-select"><option value="">— none —</option></select>
          </label>
        </div>
        <form id="compose" class="compose-row">
          <textarea id="input" rows="2" placeholder="Ask anything — e.g. TDS on rent paid to a partner, 43B(h) MSME payments, tax audit limit…"></textarea>
          <button type="submit" id="send" class="btn-primary">Ask</button>
        </form>
        <p class="disclaimer">Answers are guidance, not a signed professional opinion. Verify before filing. Tip: “note for Sharma Travels: prefers WhatsApp” saves it to the client file.</p>
      </div>
    </div>

    <!-- Client view -->
    <div id="view-client" class="view client-view" style="display:none"></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
